<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Level-Up Gamer | Iniciar Sesión</title>
  <!-- Bootstrap 5 CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <!-- CSS Externo -->
  <link rel="stylesheet" href="./assets/css/styles.css">
</head>
<body>

  <!-- Encabezado-->
  <header class="py-3 sticky-top">
    <div class="container d-flex flex-wrap justify-content-between align-items-center gap-3">
      <a href="index.html" class="d-flex align-items-center gap-2 text-decoration-none text-white brand-font fs-4">
        <i class="bi bi-controller text-primary fs-3"></i>
        <span>LEVEL-UP <span class="text-success">GAMER</span></span>
      </a>

      <nav>
        <ul class="nav">
          <li class="nav-item"><a class="nav-link px-3 text-white" href="index.html">Inicio</a></li>
          <li class="nav-item"><a class="nav-link px-3 text-white" href="index.html#catalogo">Productos</a></li>
          <li class="nav-item"><a class="nav-link px-3 text-white fw-bold active" href="login.html">Iniciar sesión</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <!-- Contenedor Principal del Login -->
  <main class="container my-5">
    <div class="row justify-content-center">
      <div class="col-12 col-md-6 col-lg-5">

        <!-- Logo y Nombre de empresa superior -->
        <div class="text-center mb-4">
          <i class="bi bi-controller display-3 text-primary"></i>
          <h2 class="brand-font text-white mt-2">LEVEL-UP GAMER</h2>
          <p class="text-secondary small">Ingresa a tu cuenta para continuar comprando</p>
        </div>

        <!-- Contenedor del Login -->
        <div class="card-gamer p-4 p-md-5 border border-secondary shadow-lg rounded-3">
          <h3 class="h5 brand-font text-white mb-4 border-bottom border-secondary pb-2">Inicio de sesión</h3>

          <form id="loginForm" novalidate>
            <!-- Correo -->
            <div class="mb-3">
              <label for="correo" class="form-label text-white small fw-bold">CORREO</label>
              <input type="email" class="form-control" id="correo" placeholder="ejemplo@correo.com">
              <span class="error-msg" id="error-correo"></span>
            </div>

            <!-- Contraseña -->
            <div class="mb-4">
              <label for="password" class="form-label text-white small fw-bold">CONTRASEÑA</label>
              <input type="password" class="form-control" id="password" placeholder="••••••••">
              <span class="error-msg" id="error-password"></span>
            </div>

            <!-- Boton Ingresar -->
            <button type="submit" class="btn btn-primary w-100 py-2 fw-bold text-uppercase">
              Iniciar sesión
            </button>
          </form>

          <!-- Enlace destacado a Registro -->
          <div class="text-center mt-4 pt-3 border-top border-secondary">
            <span class="text-secondary small">¿No tienes cuenta todavía?</span><br>
            <a href="registro.html" class="text-info fw-bold text-decoration-none small">
              <i class="bi bi-person-plus me-1"></i> Registrar usuario aquí
            </a>
          </div>

        </div>

      </div>
    </div>
  </main>

  <script src="assets/app.js"></script>
  <script src="assets/login.js"></script>
</body>
</html>
